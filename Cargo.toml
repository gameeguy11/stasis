[package]
name = "sixb6t-login-bot"
version = "0.2.0"
edition = "2024"

[profile.dev]
opt-level = 1
[profile.release]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3

[dependencies]
azalea = "0.15"
tokio = { version = "1", features = ["rt", "time"] }
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
console = "0.15"
clap = { version = "4", features = ["derive"] }
pkcs1 = "=0.8.0-rc.4"
pkcs8 = "=0.11.0-rc.11"

[patch.crates-io]
azalea-chat = { path = "vendor/azalea-chat" }